{% extends "base.html" %}

{% block title %}Items — Kitchen &amp; Counter{% endblock %}

{% block content %}
<!--
    NOTE ON DATA FLOW
    This markup intentionally contains no Jinja product/category loops.
    script.js fetches the catalog and stock from your FastAPI endpoints
    (/api/products, /api/stock) on load and renders everything into the
    empty containers below. See script.js's top-of-file comment for the
    full caching/polling strategy.
-->

<!-- MAIN PRODUCT SECTION -->
<section class="products-section" id="top">
    <header class="products-header">
        <h2 class="breadcrumb">Items</h2>
        <div class="header-controls">
            <h1 id="category-title">All Products</h1>

            <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                <i class="fa-solid fa-sun" style="font-size:12px; color: var(--text-muted);"></i>
                <span class="track"><span class="thumb"><i id="theme-icon" class="fa-solid fa-sun"></i></span></span>
                <i class="fa-solid fa-moon" style="font-size:12px; color: var(--text-muted);"></i>
            </button>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search products...">
            </div>

            <button id="start-scanner-btn" class="icon-btn primary" title="Scan QR" aria-label="Scan QR code">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button id="add-custom-btn" class="icon-btn" title="Add Custom Item" aria-label="Add custom item">
                <i class="fa-solid fa-pen"></i>
            </button>
        </div>

        <div class="live-indicator" id="live-indicator" title="Stock is polled automatically every 15s">
            <span class="dot"></span><span id="live-indicator-text">Syncing stock…</span>
        </div>
    </header>

    <!-- QR Reader Container (hidden until "Scan QR" is clicked) -->
    <div id="qr-reader-container">
        <div id="qr-reader"></div>
        <div id="qr-status"></div>
        <button id="close-scanner-btn" class="close-scanner-btn">Close Scanner</button>
    </div>

    <!-- Populated by renderCategories() in script.js -->
    <div class="categories" id="categories-container"></div>

    <!-- Populated by renderProducts() in script.js -->
    <div class="product-grid" id="product-grid"></div>
</section>

<!-- RIGHT CART SECTION -->
<section class="cart-section" id="cart-panel">
    <div class="cart-header">
        <h2>Current Order</h2>
        <div class="cashier-info">
            <img id="cashier-avatar" alt="Cashier avatar">
            <span id="cashier-name">Signing in…</span>
        </div>
    </div>

    <!-- Populated by renderCart() in script.js -->
    <div class="cart-items" id="cart-items-container"></div>

    <div class="promo-row">
        <input type="text" id="promo-input" placeholder="Promo code (try SWEET10)" aria-label="Promo code">
        <button id="promo-apply-btn">Apply</button>
    </div>
    <div class="promo-feedback" id="promo-feedback"></div>

    <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">₦0.00</span></div>
        <div class="summary-row discount-row"><span>Discount</span><span id="summary-discount">₦0.00</span></div>
        <div class="summary-row"><span>Tax (5%)</span><span id="summary-tax">₦0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="summary-total">₦0.00</span></div>
        <button class="checkout-btn" id="checkout-btn" disabled>Continue</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<!-- QR scanning library — script.js checks for it and fails gracefully if this is blocked -->
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="{{ url_for('static', path='category-icons.js') }}"></script>
<script src="{{ url_for('static', path='auth.js') }}"></script>
<script src="{{ url_for('static', path='script.js') }}" defer></script>
{% endblock %}
