<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Kitchen &amp; Counter</title>

    <!-- Same pre-paint theme guard as base.html — kept in sync manually
         since this page doesn't extend base.html. See theme.js for the
         toggle logic (this page has no toggle button, just respects
         whatever was last chosen elsewhere in the app). -->
    <script>
        (function () {
            var saved = localStorage.getItem('kc_theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='login.css') }}">
</head>
<body class="login-body">
    <main class="login-card">
        <div class="login-logo"><i class="fa-solid fa-circle-notch"></i></div>
        <h1>Kitchen &amp; Counter</h1>
        <p class="login-subtitle">Sign in to continue</p>

        <form id="login-form" novalidate>
            <label for="business-code">Business code</label>
            <input type="text" id="business-code" name="business-code" autocomplete="organization" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>

            <button type="submit" id="login-btn">Sign in</button>
        </form>
    </main>

    <!-- auth.js must load before login.js — login.js calls window.Auth.login() -->
    <script src="{{ url_for('static', path='auth.js') }}"></script>
    <script src="{{ url_for('static', path='login.js') }}"></script>
</body>
</html>
