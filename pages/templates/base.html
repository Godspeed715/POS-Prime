<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kitchen &amp; Counter — POS{% endblock %}</title>

    <!--
        FASTAPI SETUP
        This assumes the standard layout:
            app/
              main.py
              templates/
                base.html   <- this file
                pos.html
              static/
                style.css
                script.js

        In main.py:
            from fastapi.staticfiles import StaticFiles
            from fastapi.templating import Jinja2Templates
            app.mount("/static", StaticFiles(directory="static"), name="static")
            templates = Jinja2Templates(directory="templates")

        That's what makes `url_for('static', path=...)` below resolve correctly.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Display face: Bricolage Grotesque (headings) — Body/UI face: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div id="toast" role="status" aria-live="polite"></div>

    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <nav class="sidebar" aria-label="Primary">
            <div class="logo"><i class="fa-solid fa-circle-notch"></i></div>
            <div class="nav-links">
                <a href="/" title="Home — back to main site" aria-label="Home"><i class="fa-solid fa-house"></i></a>
                <a href="#top" class="active" aria-current="page" title="Products (this page)" aria-label="Products"><i class="fa-solid fa-border-all"></i></a>
                <a href="/" title="Bookmarks — back to main site" aria-label="Bookmarks"><i class="fa-regular fa-bookmark"></i></a>
                <a href="#cart-panel" title="Jump to current order" aria-label="Current order"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="/" title="Messages — back to main site" aria-label="Messages"><i class="fa-regular fa-message"></i></a>
            </div>
            <div class="nav-bottom">
                <a href="/" title="Settings — back to main site" aria-label="Settings"><i class="fa-solid fa-gear"></i></a>
                <a href="/" title="Log out — back to main site" aria-label="Log out"><i class="fa-solid fa-power-off"></i></a>
            </div>
        </nav>

        <!-- DYNAMIC CONTENT AREA -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Child templates inject their <script> tags here, after all DOM exists -->
    {% block scripts %}{% endblock %}
</body>
</html>
