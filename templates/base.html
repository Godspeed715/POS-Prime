<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kitchen &amp; Counter — POS{% endblock %}</title>

    <!--
        Applies the saved theme BEFORE first paint, synchronously, so a
        dark-mode user doesn't see a flash of the light theme on every page
        load. Deliberately inline (not an external file) so it runs before
        the stylesheet is even parsed. theme.js (loaded later, near the
        bottom of the page) handles the toggle button click + saving.
    -->
    <script>
        (function () {
            var saved = localStorage.getItem('kc_theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>

    <!--
        FASTAPI SETUP
        This assumes the standard layout:
            app/
              main.py
              templates/
                base.html   <- this file
                pos.html
              static/
                style.css
                script.js

        In main.py:
            from fastapi.staticfiles import StaticFiles
            from fastapi.templating import Jinja2Templates
            app.mount("/static", StaticFiles(directory="static"), name="static")
            templates = Jinja2Templates(directory="templates")

        That's what makes `url_for('static', path=...)` below resolve correctly.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Display face: Bricolage Grotesque (headings) — Body/UI face: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="toast" role="status" aria-live="polite"></div>

    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <nav class="sidebar" aria-label="Primary">
            <div class="logo"><i class="fa-solid fa-circle-notch"></i></div>
            <div class="nav-links">
                <a href="/" title="Point of sale" aria-label="Point of sale" class="{{ 'active' if request.url.path == '/pos' else '' }}" {{ 'aria-current=page' if request.url.path == '/pos' else '' }}><i class="fa-solid fa-border-all"></i></a>
                <a href="/transactions" title="Transactions" aria-label="Transactions" class="{{ 'active' if request.url.path == '/transactions' else '' }}" {{ 'aria-current=page' if request.url.path == '/transactions' else '' }}><i class="fa-solid fa-receipt"></i></a>
                <a href="/stock" title="Stock management" aria-label="Stock management" data-role-required="admin,super_admin" class="{{ 'active' if request.url.path == '/stock' else '' }}" {{ 'aria-current=page' if request.url.path == '/stock' else '' }}><i class="fa-solid fa-boxes-stacked"></i></a>
                <a href="/reconcile" title="Reconcile nameless stock" aria-label="Reconcile nameless stock" data-role-required="admin,super_admin" class="{{ 'active' if request.url.path == '/reconcile' else '' }}" {{ 'aria-current=page' if request.url.path == '/reconcile' else '' }}><i class="fa-solid fa-code-merge"></i></a>
                <!-- super_admin only — platform-level console for creating businesses/admins/employees, not a per-business feature -->
                <a href="/signup" title="Add business or employee" aria-label="Add business or employee" data-role-required="super_admin" class="{{ 'active' if request.url.path == '/signup' else '' }}" {{ 'aria-current=page' if request.url.path == '/signup' else '' }}><i class="fa-solid fa-user-plus"></i></a>
            </div>
            <div class="nav-bottom">
                <button id="theme-toggle" class="sidebar-icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
                    <i id="theme-icon" class="fa-solid fa-sun"></i>
                </button>
                <!-- Opens the settings modal (business code / change password / log out) — see settings.js -->
                <button id="settings-btn" class="sidebar-icon-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </nav>

        <!-- DYNAMIC CONTENT AREA -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- SETTINGS MODAL — opened from the sidebar gear icon.
         Business code is fetched from GET /api/settings/me on open (see
         settings.js). The "Log out" button reuses the same
         data-action="logout" attribute the old sidebar icon had, so the
         existing auth.js listener keeps working. -->
    <div id="settings-modal" class="settings-modal-overlay" hidden>
        <div class="settings-modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
            <div class="settings-modal-header">
                <h2 id="settings-modal-title">Settings</h2>
                <button class="modal-close-btn" data-action="close-settings" aria-label="Close settings">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="modal-body">
                <section class="settings-section">
                    <span class="settings-label">Business code</span>
                    <div class="settings-value-row">
                        <code id="settings-business-code">—</code>
                        <button type="button" class="icon-btn-sm" id="copy-business-code" title="Copy business code" aria-label="Copy business code">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                </section>

                <section class="settings-section">
                    <span class="settings-label">Change password</span>
                    <form id="change-password-form" class="settings-form" novalidate>
                        <input type="password" id="current-password" name="current_password" placeholder="Current password" autocomplete="current-password" required>
                        <input type="password" id="new-password" name="new_password" placeholder="New password" autocomplete="new-password" required minlength="8">
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required minlength="8">
                        <p id="password-feedback" class="promo-feedback" aria-live="polite"></p>
                        <button type="submit" class="modal-primary-btn">Update password</button>
                    </form>
                </section>

                <section class="settings-section">
                    <button type="button" class="modal-danger-btn" data-action="logout">
                        <i class="fa-solid fa-power-off"></i> Log out
                    </button>
                </section>
            </div>
        </div>
    </div>

    <!-- Shared across every page — theme toggle wiring, logout wiring (via
         auth.js loaded in each child template's scripts block) -->
    <script src="{{ url_for('static', path='theme.js') }}"></script>
    <script src="{{ url_for('static', path='settings.js') }}"></script>

    <!-- Child templates inject their <script> tags here, after all DOM exists -->
    {% block scripts %}{% endblock %}
</body>
</html>
